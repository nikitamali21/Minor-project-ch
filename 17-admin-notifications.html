<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Notifications</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

.clickable{cursor:pointer}

svg{
  display:block;
  flex-shrink:0;
}

.notification{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px;
}

.notification + .notification{
  border-top:0.5px solid #E5E7EB;
}

.icon-box{
  width:34px;
  height:34px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">

    <div
      class="clickable"
      onclick="go('04-admin-dashboard.html')">

      <svg width="19" height="19" viewBox="0 0 24 24"
           fill="none" stroke="#18181B" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>

    </div>

    <p style="font-size:14px;font-weight:500;flex:1;">
      Notifications
    </p>

    <button
      onclick="markAllRead()"
      style="border:none;background:none;color:#0F6E56;font-size:12px;padding:0;">
      Mark all read
    </button>

  </div>


  <!-- Today -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Today
  </p>

  <div
    id="todayNotifications"
    style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:20px;">

    <!-- Greenfield College -->
    <div class="notification unread">

      <div class="icon-box" style="background:#E1F5EE;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#085041" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/>
          <path d="M5 21V5l7-3 7 3v16"/>
          <path d="M9 21v-4h6v4"/>
          <path d="M9 9h.01"/>
          <path d="M15 9h.01"/>
          <path d="M9 13h.01"/>
          <path d="M15 13h.01"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;margin-bottom:2px;">
          Greenfield College just registered on the platform
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          10 min ago
        </p>

      </div>

      <div class="unread-dot"
           style="width:7px;height:7px;border-radius:50%;background:#0F6E56;margin-top:4px;flex-shrink:0;">
      </div>

    </div>


    <!-- ABC Salon -->
    <div class="notification unread">

      <div class="icon-box" style="background:#FAEEDA;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#854F0B" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.3 3.2 2.7 16.5a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0Z"/>
          <path d="M12 9v4"/>
          <path d="M12 17h.01"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;margin-bottom:2px;">
          ABC Salon marked inactive due to no queue activity
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          2 hr ago
        </p>

      </div>

      <div class="unread-dot"
           style="width:7px;height:7px;border-radius:50%;background:#0F6E56;margin-top:4px;flex-shrink:0;">
      </div>

    </div>

  </div>


  <!-- Earlier -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Earlier
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;">

    <!-- Weekly Summary -->
    <div class="notification">

      <div class="icon-box" style="background:#F0F0F0;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#6B7280" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V5"/>
          <path d="M4 19h17"/>
          <path d="M8 16v-5"/>
          <path d="M12 16V7"/>
          <path d="M16 16v-3"/>
          <path d="M20 16V4"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;color:#6B7280;margin-bottom:2px;">
          Weekly summary - 18 organizations, 142 tokens issued
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          Yesterday
        </p>

      </div>

    </div>


    <!-- Union Bank -->
    <div class="notification">

      <div class="icon-box" style="background:#F0F0F0;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#6B7280" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 10 9-6 9 6"/>
          <path d="M5 10v8"/>
          <path d="M9 10v8"/>
          <path d="M15 10v8"/>
          <path d="M19 10v8"/>
          <path d="M3 21h18"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;color:#6B7280;margin-bottom:2px;">
          Union Bank updated its business hours
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          2 days ago
        </p>

      </div>

    </div>

  </div>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}

function markAllRead(){

  document.querySelectorAll('.unread-dot').forEach(function(dot){
    dot.style.display = 'none';
  });

  document.querySelectorAll('.unread').forEach(function(item){
    item.classList.remove('unread');
  });
}
</script>

</body>
</html>
