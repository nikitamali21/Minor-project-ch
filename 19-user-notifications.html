<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Notifications</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

.clickable{
  cursor:pointer;
}

button{
  border:0;
  background:none;
  font-family:inherit;
  cursor:pointer;
}

svg{
  display:block;
  flex-shrink:0;
}

.notification{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px;
}

.notification + .notification{
  border-top:0.5px solid #E5E7EB;
}

.icon-box{
  width:34px;
  height:34px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">

    <div
      class="clickable"
      onclick="go('11-user-dashboard.html')">

      <svg width="19" height="19" viewBox="0 0 24 24"
           fill="none"
           stroke="#18181B"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>

    </div>

    <p style="font-size:14px;font-weight:500;flex:1;">
      Notifications
    </p>

    <button
      onclick="markAllRead()"
      style="font-size:12px;color:#0F6E56;padding:0;">
      Mark all read
    </button>

  </div>


  <!-- TODAY -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Today
  </p>

  <div
    style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:20px;">

    <!-- Up in 5 -->
    <div
      class="notification unread"
      style="background:#E1F5EE;">

      <div
        class="icon-box"
        style="background:#FFFFFF;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none"
             stroke="#085041"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          <path d="M17 3l1 1"/>
          <path d="M7 3 6 4"/>

        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p
          style="font-size:13px;margin-bottom:2px;color:#04342C;font-weight:500;">
          You're up in 5! CityCare Hospital is now serving 010
        </p>

        <p style="font-size:11px;color:#0F6E56;">
          2 min ago
        </p>

      </div>

      <div
        class="unread-dot"
        style="width:7px;height:7px;border-radius:50%;background:#0F6E56;margin-top:4px;flex-shrink:0;">
      </div>

    </div>


    <!-- Token generated -->
    <div class="notification">

      <div
        class="icon-box"
        style="background:#F0F0F0;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none"
             stroke="#6B7280"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

          <path d="M4 7V5a1 1 0 0 1 1-1h2"/>
          <path d="M4 17v2a1 1 0 0 0 1 1h2"/>
          <path d="M20 7V5a1 1 0 0 0-1-1h-2"/>
          <path d="M20 17v2a1 1 0 0 1-1 1h-2"/>
          <path d="M7 12h10"/>

        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p
          style="font-size:13px;margin-bottom:2px;color:#6B7280;">
          Your token 015 was generated for CityCare Hospital
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          32 min ago
        </p>

      </div>

    </div>

  </div>


  <!-- YESTERDAY -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Yesterday
  </p>

  <div
    style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;">

    <!-- Served -->
    <div class="notification">

      <div
        class="icon-box"
        style="background:#F0F0F0;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none"
             stroke="#6B7280"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

          <circle cx="12" cy="12" r="9"/>
          <path d="m8 12 3 3 5-6"/>

        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p
          style="font-size:13px;margin-bottom:2px;color:#6B7280;">
          You were served at ABC Salon - token 006
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          Yesterday, 4:12 PM
        </p>

      </div>

    </div>


    <!-- Cancelled -->
    <div class="notification">

      <div
        class="icon-box"
        style="background:#F0F0F0;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none"
             stroke="#6B7280"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

          <path d="M6 6l12 12"/>
          <path d="M18 6 6 18"/>

        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p
          style="font-size:13px;margin-bottom:2px;color:#6B7280;">
          Your Union Bank queue entry was cancelled
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          Yesterday, 11:40 AM
        </p>

      </div>

    </div>

  </div>

</div>
</div>


<script>

function go(page){
  window.location.href = page;
}

function markAllRead(){

  document.querySelectorAll('.unread-dot').forEach(function(dot){
    dot.style.display = 'none';
  });

  document.querySelectorAll('.unread').forEach(function(item){
    item.style.background = '#FFFFFF';
  });
}

</script>

</body>
</html>
