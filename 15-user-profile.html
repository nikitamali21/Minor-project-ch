<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#FFFFFF;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

button{
  border:1px solid #E5E7EB;
  border-radius:8px;
  background:#fff;
  font-family:inherit;
  cursor:pointer;
}

.clickable{cursor:pointer}

svg{
  display:block;
  flex-shrink:0;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">

    <div class="clickable" onclick="go('11-user-dashboard.html')">
      <svg width="19" height="19" viewBox="0 0 24 24"
           fill="none" stroke="#18181B" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </div>

    <p style="font-size:14px;font-weight:500;flex:1;">
      Profile
    </p>

    <div class="clickable" onclick="editProfile()">
      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="#0F6E56" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
      </svg>
    </div>

  </div>


  <!-- Profile Identity -->
  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px;">

    <div style="width:64px;height:64px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500;color:#085041;margin-bottom:10px;">
      AM
    </div>

    <p style="font-size:17px;font-weight:500;">
      Aarav Mehta
    </p>

    <p style="font-size:13px;color:#6B7280;margin-top:2px;">
      aarav.mehta@email.com
    </p>

  </div>


  <!-- Stats -->
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px;">

    <div style="background:#EDEDED;border-radius:10px;padding:16px;">
      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Active queues
      </p>

      <p style="font-size:24px;font-weight:500;">
        2
      </p>
    </div>

    <div style="background:#EDEDED;border-radius:10px;padding:16px;">
      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Visits total
      </p>

      <p style="font-size:24px;font-weight:500;">
        23
      </p>
    </div>

  </div>


  <!-- Personal Information -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Personal information
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:24px;">

    <div style="display:flex;align-items:center;gap:12px;padding:12px;border-bottom:0.5px solid #E5E7EB;">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none" stroke="#6B7280" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2C10.3 21 3 13.7 3 5a2 2 0 0 1 2-2"/>
      </svg>

      <p style="font-size:13px;">
        +1 (415) 555-0184
      </p>

    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:12px;">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none" stroke="#6B7280" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>

      <p style="font-size:13px;">
        aarav.mehta@email.com
      </p>

    </div>

  </div>


  <!-- More -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    More
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:24px;">

    <!-- Queue History -->
    <div
      class="clickable"
      onclick="go('16-user-queue-history.html')"
      style="display:flex;align-items:center;gap:12px;padding:12px;border-bottom:0.5px solid #E5E7EB;">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none" stroke="#6B7280" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <path d="M3 4v5h5"/>
        <path d="M12 7v5l3 2"/>
      </svg>

      <p style="font-size:14px;flex:1;">
        Queue history
      </p>

      <svg width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="#9CA3AF" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>


    <!-- Notification Preferences -->
    <div
      class="clickable"
      onclick="go('19-user-notifications.html')"
      style="display:flex;align-items:center;gap:12px;padding:12px;">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none" stroke="#6B7280" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>

      <p style="font-size:14px;flex:1;">
        Notification preferences
      </p>

      <svg width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="#9CA3AF" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>

  </div>


  <!-- Logout -->
  <button
    onclick="logout()"
    style="width:100%;height:44px;font-size:15px;font-weight:500;color:#6B7280;display:flex;align-items:center;justify-content:center;gap:6px;">

    <svg width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="#6B7280" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 17l5-5-5-5"/>
      <path d="M15 12H3"/>
      <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>
    </svg>

    Log out

  </button>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}

function editProfile(){
  alert("Edit profile flow can be connected here.");
}

function logout(){
  if(confirm("Are you sure you want to log out?")){
    window.location.href = "00-role-selection.html";
  }
}
</script>

</body>
</html>
