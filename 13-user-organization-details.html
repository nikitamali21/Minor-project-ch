<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Organization Details - Springfield City Bank</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

.clickable{
  cursor:pointer;
}

svg{
  display:block;
  flex-shrink:0;
}

button{
  font-family:inherit;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div class="clickable"
       onclick="go('12-user-search-organization.html')"
       style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">

    <svg width="19" height="19" viewBox="0 0 24 24"
         fill="none" stroke="#18181B" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"/>
    </svg>

    <p style="font-size:14px;font-weight:500;">
      Organization details
    </p>

  </div>


  <!-- Organization -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">

    <div style="width:52px;height:52px;border-radius:14px;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#0C447C;flex-shrink:0;">
      SB
    </div>

    <div style="flex:1;min-width:0;">
      <p style="font-size:16px;font-weight:500;">
        Springfield City Bank
      </p>

      <p style="font-size:13px;color:#6B7280;">
        Banking - 1.4 mi away
      </p>
    </div>

  </div>


  <!-- Queue Stats -->
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px;">

    <div style="background:#EDEDED;border-radius:10px;padding:16px;">
      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Currently waiting
      </p>

      <p style="font-size:24px;font-weight:500;">
        4
      </p>
    </div>

    <div style="background:#EDEDED;border-radius:10px;padding:16px;">
      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Est. wait
      </p>

      <p style="font-size:24px;font-weight:500;">
        12 min
      </p>
    </div>

  </div>


  <!-- Information -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Information
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:24px;">

    <!-- Address -->
    <div style="display:flex;align-items:center;gap:12px;padding:12px;border-bottom:0.5px solid #E5E7EB;">

      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="#6B7280" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>

      <p style="font-size:13px;">
        220 Elm Street, Springfield
      </p>

    </div>


    <!-- Phone -->
    <div style="display:flex;align-items:center;gap:12px;padding:12px;border-bottom:0.5px solid #E5E7EB;">

      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="#6B7280" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                 19.79 19.79 0 0 1-8.63-3.07
                 19.5 19.5 0 0 1-6-6
                 19.79 19.79 0 0 1-3.07-8.67
                 A2 2 0 0 1 4.11 2h3
                 a2 2 0 0 1 2 1.72
                 12.84 12.84 0 0 0 .7 2.81
                 2 2 0 0 1-.45 2.11L8.09 9.91
                 a16 16 0 0 0 6 6l1.27-1.27
                 a2 2 0 0 1 2.11-.45
                 12.84 12.84 0 0 0 2.81.7
                 A2 2 0 0 1 22 16.92Z"/>
      </svg>

      <p style="font-size:13px;">
        +1 (415) 555-0146
      </p>

    </div>


    <!-- Hours -->
    <div style="display:flex;align-items:center;gap:12px;padding:12px;">

      <svg width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="#6B7280" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15 14"/>
      </svg>

      <p style="font-size:13px;">
        Mon-Fri, 9:00 AM - 5:00 PM
      </p>

    </div>

  </div>


  <!-- Add to Queue -->
  <button
    onclick="go('21-user-token-generated.html')"
    style="width:100%;background:#0F6E56;color:white;border:none;border-radius:8px;height:48px;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;">

    <svg width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="white" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16v16H4z"/>
      <path d="M8 8h8"/>
      <path d="M8 12h8"/>
      <path d="M8 16h5"/>
    </svg>

    Add me to queue

  </button>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
