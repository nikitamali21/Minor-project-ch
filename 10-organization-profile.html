<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organization Profile - CityCare Hospital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px 12px;
  background: #EDEDED;
  font-family: 'Inter', sans-serif;
  color: #18181B;
  -webkit-font-smoothing: antialiased;
}

.phone-card {
  width: 100%;
  max-width: 390px;
  min-height: 100vh;
}

h1,h2,h3,p {
  margin: 0;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.icon {
  width: 18px;
  height: 18px;
  display: block;
}

.setting-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  cursor: pointer;
}

.setting-row:hover {
  background: #FAFAFA;
}
</style>
</head>

<body>

<div class="phone-card">

  <div style="
    background:#FFFFFF;
    border-radius:14px;
    padding:20px;
    border:0.5px solid #E5E7EB;
  ">

    <!-- Header -->
    <div style="
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:24px;
    ">

      <button
        id="backBtn"
        aria-label="Back"
        style="
          width:28px;
          height:28px;
          padding:0;
          border:0;
          background:transparent;
          display:flex;
          align-items:center;
          justify-content:center;
        "
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#18181B" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="m12 19-7-7 7-7"/>
        </svg>
      </button>

      <p style="
        font-size:14px;
        font-weight:500;
        flex:1;
      ">
        Profile
      </p>

      <button
        id="editTopBtn"
        aria-label="Edit profile"
        style="
          width:28px;
          height:28px;
          padding:0;
          border:0;
          background:transparent;
          display:flex;
          align-items:center;
          justify-content:center;
        "
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#0F6E56" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>
        </svg>
      </button>

    </div>

    <!-- Organization identity -->
    <div style="
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-bottom:24px;
    ">

      <div style="
        width:64px;
        height:64px;
        border-radius:16px;
        background:#FAECE7;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:20px;
        font-weight:500;
        color:#712B13;
        margin-bottom:10px;
      ">
        CC
      </div>

      <p style="
        font-size:17px;
        font-weight:500;
      ">
        CityCare Hospital
      </p>

      <p style="
        font-size:13px;
        color:#6B7280;
        margin-top:2px;
        margin-bottom:8px;
      ">
        Healthcare
      </p>

      <span style="
        font-size:11px;
        color:#0F6E56;
        background:#E1F5EE;
        padding:3px 10px;
        border-radius:10px;
      ">
        Active
      </span>

    </div>

    <!-- Stats -->
    <div style="
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      margin-bottom:24px;
    ">

      <div style="
        background:#EDEDED;
        border-radius:10px;
        padding:16px;
      ">
        <p style="
          font-size:13px;
          color:#6B7280;
          margin-bottom:4px;
        ">
          Served today
        </p>

        <p style="
          font-size:24px;
          font-weight:500;
        ">
          10
        </p>
      </div>

      <div style="
        background:#EDEDED;
        border-radius:10px;
        padding:16px;
      ">
        <p style="
          font-size:13px;
          color:#6B7280;
          margin-bottom:4px;
        ">
          Registered
        </p>

        <p style="
          font-size:15px;
          font-weight:500;
          padding-top:6px;
        ">
          Jan 2025
        </p>
      </div>

    </div>

    <!-- Organization information -->
    <p style="
      font-size:13px;
      color:#6B7280;
      margin-bottom:8px;
    ">
      Organization information
    </p>

    <div style="
      border:0.5px solid #E5E7EB;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:24px;
    ">

      <!-- Address -->
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px;
        border-bottom:0.5px solid #E5E7EB;
      ">

        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#6B7280" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>

        <p style="font-size:13px;">
          88 Wellness Ave, Springfield
        </p>

      </div>

      <!-- Phone -->
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px;
        border-bottom:0.5px solid #E5E7EB;
      ">

        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#6B7280" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                   19.79 19.79 0 0 1-8.63-3.07
                   19.5 19.5 0 0 1-6-6
                   19.79 19.79 0 0 1-3.07-8.67
                   A2 2 0 0 1 4.11 2h3a2 2 0 0 1
                   2 1.72 12.84 12.84 0 0 0 .7 2.81
                   2 2 0 0 1-.45 2.11L8.09 9.91
                   a16 16 0 0 0 6 6l1.27-1.27
                   a2 2 0 0 1 2.11-.45
                   12.84 12.84 0 0 0 2.81.7
                   A2 2 0 0 1 22 16.92z"/>
        </svg>

        <p style="font-size:13px;">
          +1 (415) 555-0117
        </p>

      </div>

      <!-- Email -->
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px;
        border-bottom:0.5px solid #E5E7EB;
      ">

        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#6B7280" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>

        <p style="font-size:13px;">
          contact@citycare.com
        </p>

      </div>

      <!-- Hours -->
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px;
      ">

        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#6B7280" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>

        <p style="font-size:13px;">
          Mon-Sat, 8:00 AM - 8:00 PM
        </p>

      </div>

    </div>

    <!-- Settings -->
    <p style="
      font-size:13px;
      color:#6B7280;
      margin-bottom:8px;
    ">
      Settings
    </p>

    <div style="
      border:0.5px solid #E5E7EB;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:24px;
    ">

      <!-- Edit organization -->
      <div
        class="setting-row"
        id="editOrgRow"
        style="border-bottom:0.5px solid #E5E7EB;"
      >

        <div style="
          width:30px;
          display:flex;
          align-items:center;
          justify-content:center;
        ">
          <svg class="icon" viewBox="0 0 24 24" fill="none"
               stroke="#6B7280" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/>
            <path d="M5 21V5l7-3 7 3v16"/>
            <path d="M9 21v-4h6v4"/>
            <path d="M9 9h1"/>
            <path d="M14 9h1"/>
            <path d="M9 13h1"/>
            <path d="M14 13h1"/>
          </svg>
        </div>

        <p style="
          font-size:14px;
          flex:1;
        ">
          Edit organization info
        </p>

        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#9CA3AF" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>

      </div>

      <!-- Notification preferences -->
      <div
        class="setting-row"
        id="notificationRow"
      >

        <div style="
          width:30px;
          display:flex;
          align-items:center;
          justify-content:center;
        ">
          <svg class="icon" viewBox="0 0 24 24" fill="none"
               stroke="#6B7280" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>

        <p style="
          font-size:14px;
          flex:1;
        ">
          Notification preferences
        </p>

        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="#9CA3AF" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>

      </div>

    </div>

    <!-- Logout -->
    <button
      id="logoutBtn"
      style="
        width:100%;
        height:44px;
        font-size:15px;
        font-weight:500;
        color:#6B7280;
        border:1px solid #E5E7EB;
        border-radius:8px;
        background:#FFFFFF;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:6px;
      "
    >

      <svg class="icon" viewBox="0 0 24 24" fill="none"
           stroke="#6B7280" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="m16 17 5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>

      Log out

    </button>

  </div>

</div>

<script>
document.getElementById("backBtn").addEventListener("click", function () {
  window.location.href = "07-organization-dashboard.html";
});

document.getElementById("editTopBtn").addEventListener("click", function () {
  alert("Edit organization information flow can be connected here.");
});

document.getElementById("editOrgRow").addEventListener("click", function () {
  alert("Edit organization information flow can be connected here.");
});

document.getElementById("notificationRow").addEventListener("click", function () {
  window.location.href = "18-organization-notifications.html";
});

document.getElementById("logoutBtn").addEventListener("click", function () {
  const confirmed = confirm("Log out of Smart Queue?");
  if (confirmed) {
    window.location.href = "00-role-selection.html";
  }
});
</script>

</body>
</html>
