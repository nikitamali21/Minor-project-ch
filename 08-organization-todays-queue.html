<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organization Today's Queue List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px 12px;
  background: #EDEDED;
  font-family: 'Inter', sans-serif;
  color: #18181B;
  -webkit-font-smoothing: antialiased;
}

.phone-card {
  width: 100%;
  max-width: 390px;
  min-height: 100vh;
}

h1,h2,h3,p {
  margin: 0;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.clickable {
  cursor: pointer;
}

.clickable:hover {
  background: #FAFAFA;
}

.icon {
  width: 19px;
  height: 19px;
  display: block;
}
</style>
</head>

<body>

<div class="phone-card">

  <div style="
    background:#FFFFFF;
    border-radius:14px;
    padding:20px;
    border:0.5px solid #E5E7EB;

      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:20px;

        id="backBtn"
        aria-label="Back"

          height:28px;
          padding:0;
          border:0;
          background:transparent;
          display:flex;
          align-items:center;
          justify-content:center;
        "

        <svg class="icon" viewBox="0 0 24 24" fill="none"

          <path d="M19 12H5"/>
          <path d="m12 19-7-7 7-7"/>

        font-size:14px;
        font-weight:500;
        flex:1;

        Today's queue

        id="addUserBtn"

          align-items:center;

        <svg class="icon" viewBox="0 0 24 24" fill="none"

          <path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <path d="M20 8v6"/>
          <path d="M23 11h-6"/>
        </svg>
      </button>

    </div>

      background:#E1F5EE;
      border-radius:12px;
      padding:14px;
      margin-bottom:20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

        <p style="
          font-size:11px;
          color:#0F6E56;
          margin-bottom:2px;
