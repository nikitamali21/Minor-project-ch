<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organization Notifications</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

.clickable{cursor:pointer}

svg{
  display:block;
  flex-shrink:0;
}

.notification{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px;
}

.notification + .notification{
  border-top:0.5px solid #E5E7EB;
}

.icon-box{
  width:34px;
  height:34px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">

    <div
      class="clickable"
      onclick="go('07-organization-dashboard.html')">

      <svg width="19" height="19" viewBox="0 0 24 24"
           fill="none" stroke="#18181B" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>

    </div>

    <p style="font-size:14px;font-weight:500;flex:1;">
      Notifications
    </p>

    <button
      onclick="markAllRead()"
      style="border:none;background:none;color:#0F6E56;font-size:12px;padding:0;">
      Mark all read
    </button>

  </div>


  <!-- Today -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Today
  </p>

  <div
    style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:20px;">

    <!-- Karan -->
    <div class="notification unread">

      <div class="icon-box" style="background:#E1F5EE;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#085041" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3"/>
          <path d="M3 20c0-3.3 2.7-6 6-6"/>
          <path d="M17 11v6"/>
          <path d="M14 14h6"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;margin-bottom:2px;">
          Karan Verma joined your queue - token 015
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          5 min ago
        </p>

      </div>

      <div class="unread-dot"
           style="width:7px;height:7px;border-radius:50%;background:#0F6E56;margin-top:4px;flex-shrink:0;">
      </div>

    </div>


    <!-- Sara -->
    <div class="notification unread">

      <div class="icon-box" style="background:#FCEBEB;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#791F1F" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3"/>
          <path d="M3 20c0-3.3 2.7-6 6-6"/>
          <path d="m15 9 6 6"/>
          <path d="m21 9-6 6"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;margin-bottom:2px;">
          Sara Khan removed herself from the queue
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          40 min ago
        </p>

      </div>

      <div class="unread-dot"
           style="width:7px;height:7px;border-radius:50%;background:#0F6E56;margin-top:4px;flex-shrink:0;">
      </div>

    </div>


    <!-- Served -->
    <div class="notification">

      <div class="icon-box" style="background:#F0F0F0;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#6B7280" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12 4 4L19 6"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;color:#6B7280;margin-bottom:2px;">
          You've served 10 tokens today
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          1 hr ago
        </p>

      </div>

    </div>

  </div>


  <!-- Earlier -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Earlier
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;">

    <div class="notification">

      <div class="icon-box" style="background:#F0F0F0;">

        <svg width="17" height="17" viewBox="0 0 24 24"
             fill="none" stroke="#6B7280" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>

      </div>

      <div style="flex:1;min-width:0;">

        <p style="font-size:13px;color:#6B7280;margin-bottom:2px;">
          Queue closed for the day - 32 tokens served
        </p>

        <p style="font-size:11px;color:#9CA3AF;">
          Yesterday
        </p>

      </div>

    </div>

  </div>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}

function markAllRead(){

  document.querySelectorAll('.unread-dot').forEach(function(dot){
    dot.style.display = 'none';
  });

  document.querySelectorAll('.unread').forEach(function(item){
    item.classList.remove('unread');
  });
}
</script>

</body>
</html>
