<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

svg{
  display:block;
  flex-shrink:0;
}

.clickable{
  cursor:pointer;
}

.menu-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  cursor:pointer;
}

.menu-row + .menu-row{
  border-top:0.5px solid #E5E7EB;
}

.stat{
  background:#EDEDED;
  border-radius:10px;
  padding:16px;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">

    <div
      class="clickable"
      onclick="go('04-admin-dashboard.html')">

      <svg width="19" height="19" viewBox="0 0 24 24"
           fill="none"
           stroke="#18181B"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>

    </div>

    <p style="font-size:14px;font-weight:500;flex:1;">
      Profile
    </p>

    <div
      class="clickable"
      onclick="editProfile()">

      <svg width="19" height="19" viewBox="0 0 24 24"
           fill="none"
           stroke="#0F6E56"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>

    </div>

  </div>


  <!-- Profile -->
  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px;">

    <div
      style="
        width:64px;
        height:64px;
        border-radius:50%;
        background:#E1F5EE;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:20px;
        font-weight:500;
        color:#085041;
        margin-bottom:10px;">
      A
    </div>

    <p style="font-size:17px;font-weight:500;">
      Admin
    </p>

    <p style="font-size:13px;color:#6B7280;margin:2px 0 8px;">
      admin@smartqueue.com
    </p>

    <span
      style="
        font-size:11px;
        color:#0C447C;
        background:#E6F1FB;
        padding:3px 10px;
        border-radius:10px;">
      Platform owner
    </span>

  </div>


  <!-- Stats -->
  <div
    style="
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      margin-bottom:24px;">

    <div class="stat">

      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Organizations
      </p>

      <p style="font-size:24px;font-weight:500;">
        18
      </p>

    </div>

    <div class="stat">

      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Admin since
      </p>

      <p style="font-size:15px;font-weight:500;padding-top:6px;">
        Jan 2025
      </p>

    </div>

  </div>


  <!-- Personal information -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Personal information
  </p>

  <div
    style="
      border:0.5px solid #E5E7EB;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:24px;">

    <!-- Phone -->
    <div
      style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px;
        border-bottom:0.5px solid #E5E7EB;">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none"
           stroke="#6B7280"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                 19.79 19.79 0 0 1-8.63-3.07
                 19.5 19.5 0 0 1-6-6
                 19.79 19.79 0 0 1-3.07-8.67
                 A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
                 12.84 12.84 0 0 0 .7 2.81
                 2 2 0 0 1-.45 2.11L8.09 9.91
                 a16 16 0 0 0 6 6l1.27-1.27
                 a2 2 0 0 1 2.11-.45
                 12.84 12.84 0 0 0 2.81.7
                 A2 2 0 0 1 22 16.92z"/>
      </svg>

      <p style="font-size:13px;">
        +1 (415) 555-0100
      </p>

    </div>


    <!-- Email -->
    <div
      style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px;">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none"
           stroke="#6B7280"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>

      <p style="font-size:13px;">
        admin@smartqueue.com
      </p>

    </div>

  </div>


  <!-- Platform -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Platform
  </p>

  <div
    style="
      border:0.5px solid #E5E7EB;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:24px;">

    <!-- Manage organizations -->
    <div
      class="menu-row"
      onclick="go('05-admin-organizations-search.html')">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none"
           stroke="#6B7280"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
      </svg>

      <p style="font-size:14px;flex:1;">
        Manage organizations
      </p>

      <svg width="16" height="16" viewBox="0 0 24 24"
           fill="none"
           stroke="#9CA3AF"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>


    <!-- Notifications -->
    <div
      class="menu-row"
      onclick="go('17-admin-notifications.html')">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none"
           stroke="#6B7280"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>

      <p style="font-size:14px;flex:1;">
        Notification preferences
      </p>

      <svg width="16" height="16" viewBox="0 0 24 24"
           fill="none"
           stroke="#9CA3AF"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>


    <!-- Change password -->
    <div
      class="menu-row"
      onclick="changePassword()">

      <svg width="17" height="17" viewBox="0 0 24 24"
           fill="none"
           stroke="#6B7280"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>

      <p style="font-size:14px;flex:1;">
        Change password
      </p>

      <svg width="16" height="16" viewBox="0 0 24 24"
           fill="none"
           stroke="#9CA3AF"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>

  </div>


  <!-- Logout -->
  <button
    onclick="logout()"
    style="
      width:100%;
      height:44px;
      font-family:inherit;
      border:1px solid #E5E7EB;
      border-radius:8px;
      background:#fff;
      font-size:15px;
      font-weight:500;
      color:#6B7280;
      cursor:pointer;">

    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#6B7280"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      style="display:inline-block;vertical-align:-3px;margin-right:6px;">

      <path d="M10 17l5-5-5-5"/>
      <path d="M15 12H3"/>
      <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>

    </svg>

    Log out

  </button>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}

function editProfile(){
  alert("Edit profile flow can be connected here.");
}

function changePassword(){
  alert("Change password flow can be connected here.");
}

function logout(){
  if(confirm("Are you sure you want to log out?")){
    window.location.href = "00-role-selection.html";
  }
}
</script>

</body>
</html>
