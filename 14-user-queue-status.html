<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Queue Status - CityCare Hospital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

.clickable{cursor:pointer}

svg{
  display:block;
  flex-shrink:0;
}

button{
  font-family:inherit;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div class="clickable"
       onclick="go('11-user-dashboard.html')"
       style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">

    <svg width="19" height="19" viewBox="0 0 24 24"
         fill="none" stroke="#18181B" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"/>
    </svg>

    <div style="display:flex;align-items:center;gap:8px;flex:1;">

      <div style="width:22px;height:22px;border-radius:6px;background:#FAECE7;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:#712B13;">
        CC
      </div>

      <p style="font-size:14px;font-weight:500;">
        CityCare Hospital
      </p>

    </div>
  </div>


  <!-- Token Status -->
  <div style="background:#E1F5EE;border-radius:12px;padding:24px;margin-bottom:16px;text-align:center;">

    <p style="font-size:12px;color:#0F6E56;margin-bottom:6px;">
      Your token
    </p>

    <p style="font-size:40px;font-weight:500;color:#04342C;margin-bottom:10px;">
      015
    </p>

    <div style="height:6px;background:#9FE1CB;border-radius:3px;overflow:hidden;margin-bottom:8px;">
      <div style="width:73%;height:100%;background:#085041;border-radius:3px;"></div>
    </div>

    <p style="font-size:13px;color:#0F6E56;">
      Now serving 011 - you're up in 4
    </p>

  </div>


  <!-- Queue Stats -->
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px;">

    <div style="background:#EDEDED;border-radius:10px;padding:16px;">
      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Position
      </p>

      <p style="font-size:24px;font-weight:500;">
        4th
      </p>
    </div>

    <div style="background:#EDEDED;border-radius:10px;padding:16px;">
      <p style="font-size:13px;color:#6B7280;margin-bottom:4px;">
        Est. wait
      </p>

      <p style="font-size:24px;font-weight:500;">
        18 min
      </p>
    </div>

  </div>


  <!-- Notification Info -->
  <div style="display:flex;gap:10px;padding:12px;background:#EDEDED;border-radius:10px;margin-bottom:24px;">

    <svg width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="#854F0B" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      <path d="M19 4l1 1"/>
      <path d="M5 4 4 5"/>
    </svg>

    <p style="font-size:13px;color:#6B7280;">
      We'll notify you when you're 5 tokens away, so you don't need to keep checking.
    </p>

  </div>


  <!-- Remove -->
  <button
    onclick="removeFromQueue()"
    style="width:100%;height:44px;font-size:15px;font-weight:500;margin-bottom:10px;border:1px solid #F09595;border-radius:8px;background:#fff;color:#791F1F;display:flex;align-items:center;justify-content:center;gap:6px;">

    <svg width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="#791F1F" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6l12 12"/>
      <path d="M18 6 6 18"/>
    </svg>

    Remove me from queue

  </button>


  <!-- Add Again -->
  <button
    onclick="go('21-user-token-generated.html')"
    style="width:100%;height:44px;font-size:15px;font-weight:500;border:1px solid #E5E7EB;border-radius:8px;background:#fff;color:#18181B;display:flex;align-items:center;justify-content:center;gap:6px;">

    <svg width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="#18181B" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11a8.1 8.1 0 0 0-15.5-2"/>
      <path d="M4 4v5h5"/>
      <path d="M4 13a8.1 8.1 0 0 0 15.5 2"/>
      <path d="M20 20v-5h-5"/>
    </svg>

    Add me again

  </button>

  <p style="font-size:11px;color:#9CA3AF;text-align:center;margin-top:8px;">
    Rejoining generates a new token at the back of the queue
  </p>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}

function removeFromQueue(){
  const confirmed = confirm("Remove your token from the queue?");

  if(confirmed){
    window.location.href = "11-user-dashboard.html";
  }
}
</script>

</body>
</html>
