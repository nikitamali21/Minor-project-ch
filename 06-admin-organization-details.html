<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Organization Details - Union Bank</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #FFFFFF;
    font-family: 'Inter', sans-serif;
    color: #18181B;
    display: flex;
    justify-content: center;
}

.phone-card {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 14px;
    padding: 24px;
}

p {
    margin: 0;
}

.header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
}

.back {
    width: 21px;
    height: 21px;
    stroke: #18181B;
    stroke-width: 2;
    fill: none;
    cursor: pointer;
}

.header-title {
    font-size: 15px;
    font-weight: 500;
}

.org-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
}

.org-avatar {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #E6F1FB;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: #0C447C;
    flex-shrink: 0;
}

.org-info {
    flex: 1;
}

.org-name {
    font-size: 16px;
    font-weight: 500;
}

.org-type {
    font-size: 13px;
    color: #6B7280;
    margin-top: 2px;
}

.status {
    font-size: 11px;
    color: #0F6E56;
    background: #E1F5EE;
    padding: 3px 10px;
    border-radius: 10px;
    white-space: nowrap;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
}

.stat-card {
    background: #EDEDED;
    border-radius: 10px;
    padding: 16px;
}

.stat-label {
    font-size: 13px;
    color: #6B7280;
    margin-bottom: 4px;
}

.stat-number {
    font-size: 24px;
    font-weight: 500;
}

.registered {
    font-size: 15px;
    font-weight: 500;
    padding-top: 6px;
}

.section-label {
    font-size: 13px;
    color: #6B7280;
    margin-bottom: 8px;
}

.info-box {
    border: 1px solid #E5E7EB;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
}

.info-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 12px;
    border-bottom: 1px solid #E5E7EB;
}

.info-row:last-child {
    border-bottom: none;
}

.info-icon {
    width: 18px;
    height: 18px;
    stroke: #6B7280;
    stroke-width: 2;
    fill: none;
    flex-shrink: 0;
}

.info-text {
    font-size: 13px;
}

button {
    width: 100%;
    height: 44px;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    background: #FFFFFF;
    color: #18181B;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
}

.edit-button {
    margin-bottom: 10px;
}

.edit-icon,
.delete-icon {
    width: 17px;
    height: 17px;
    vertical-align: -3px;
    margin-right: 6px;
    fill: none;
    stroke-width: 2;
}

.edit-icon {
    stroke: #18181B;
}

.delete-button {
    border-color: #F09595;
    color: #791F1F;
}

.delete-icon {
    stroke: #791F1F;
}
</style>
</head>

<body>

<div class="phone-card">

    <!-- HEADER -->
    <div class="header">

        <svg
            class="back"
            id="backButton"
            viewBox="0 0 24 24"
        >
            <path d="M15 18l-6-6 6-6"></path>
        </svg>

        <p class="header-title">
            Organization details
        </p>

    </div>


    <!-- ORGANIZATION -->
    <div class="org-header">

        <div class="org-avatar">
            UB
        </div>

        <div class="org-info">
            <p class="org-name">
                Union Bank
            </p>

            <p class="org-type">
                Banking
            </p>
        </div>

        <span class="status">
            Active
        </span>

    </div>


    <!-- STATS -->
    <div class="stats">

        <div class="stat-card">

            <p class="stat-label">
                In queue today
            </p>

            <p class="stat-number">
                27
            </p>

        </div>


        <div class="stat-card">

            <p class="stat-label">
                Registered since
            </p>

            <p class="registered">
                Mar 2025
            </p>

        </div>

    </div>


    <!-- INFORMATION -->
    <p class="section-label">
        Information
    </p>

    <div class="info-box">

        <!-- Address -->
        <div class="info-row">

            <svg class="info-icon" viewBox="0 0 24 24">
                <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path>
                <circle cx="12" cy="9" r="2.5"></circle>
            </svg>

            <p class="info-text">
                142 Market Street, Springfield
            </p>

        </div>


        <!-- Phone -->
        <div class="info-row">

            <svg class="info-icon" viewBox="0 0 24 24">
                <path d="M6 3h3l2 5-2 2c1.2 2.4 2.6 3.8 5 5l2-2 5 2v3c0 1-1 2-2 2C11.7 20 4 12.3 4 5c0-1 1-2 2-2z"></path>
            </svg>

            <p class="info-text">
                +1 (415) 555-0139
            </p>

        </div>


        <!-- Email -->
        <div class="info-row">

            <svg class="info-icon" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M3 7l9 6 9-6"></path>
            </svg>

            <p class="info-text">
                contact@unionbank.com
            </p>

        </div>


        <!-- Working hours -->
        <div class="info-row">

            <svg class="info-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 7v5l3 2"></path>
            </svg>

            <p class="info-text">
                Mon-Fri, 9:00 AM - 5:00 PM
            </p>

        </div>

    </div>


    <!-- ACTIONS -->
    <button
        class="edit-button"
        id="editButton"
    >

        <svg class="edit-icon" viewBox="0 0 24 24">
            <path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
            <path d="M13 6l4 4"></path>
        </svg>

        Edit organization

    </button>


    <button
        class="delete-button"
        id="removeButton"
    >

        <svg class="delete-icon" viewBox="0 0 24 24">
            <path d="M4 7h16"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M6 7l1 13h10l1-13"></path>
            <path d="M9 7V4h6v3"></path>
        </svg>

        Remove organization

    </button>

</div>


<script>

document.getElementById("backButton").onclick = function() {
    window.location.href = "05-admin-organizations-search.html";
};


document.getElementById("editButton").onclick = function() {
    alert("Edit organization flow can be connected here.");
};


document.getElementById("removeButton").onclick = function() {

    const confirmed = confirm(
        "Are you sure you want to remove this organization?"
    );

    if (confirmed) {
        alert("Organization removal can be connected to the backend here.");
    }

};

</script>

</body>
</html>
