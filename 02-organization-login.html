<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Queue - Organization Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #FFFFFF;
    font-family: 'Inter', sans-serif;
    color: #18181B;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.phone-card {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    background: #FFFFFF;
    border-radius: 14px;
    border: 1px solid #E5E7EB;
    padding: 52px 24px 40px;
}

.logo-box {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: #E1F5EE;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
}

.logo-box svg {
    width: 36px;
    height: 36px;
    stroke: #085041;
    stroke-width: 2;
    fill: none;
}

h1 {
    text-align: center;
    margin: 0 0 6px;
    font-size: 27px;
    font-weight: 600;
}

.subtitle {
    text-align: center;
    color: #6B7280;
    font-size: 15px;
    margin: 0 0 10px;
}

.badge-container {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
}

.badge {
    background: #E1F5EE;
    color: #085041;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 13px;
    border-radius: 20px;
}

label {
    display: block;
    font-size: 13px;
    color: #6B7280;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 44px;
    border: 1px solid #E5E7EB;
    border-radius: 9px;
    padding: 0 12px;
    font-family: inherit;
    font-size: 14px;
    color: #18181B;
    background: #FFFFFF;
    outline: none;
    margin-bottom: 18px;
}

input:focus {
    border-color: #0F6E56;
}

input::placeholder {
    color: #9CA3AF;
}

.forgot {
    text-align: right;
    margin-top: -8px;
    margin-bottom: 24px;
}

.forgot a {
    font-size: 13px;
    color: #0F6E56;
    text-decoration: none;
}

.login-btn {
    width: 100%;
    height: 44px;
    background: #0F6E56;
    color: #FFFFFF;
    border: none;
    border-radius: 9px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
}

.login-btn:hover {
    background: #0C5D49;
}

.divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 26px 0 16px;
}

.divider-line {
    flex: 1;
    height: 1px;
    background: #E5E7EB;
}

.divider-text {
    font-size: 12px;
    color: #9CA3AF;
}

.other-btn {
    width: 100%;
    height: 40px;
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 9px;
    color: #18181B;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
}

.other-btn:hover {
    background: #F9FAFB;
}

.back {
    text-align: center;
    margin-top: 22px;
}

.back a {
    color: #6B7280;
    font-size: 13px;
    text-decoration: none;
}

@media (max-width: 390px) {
    .phone-card {
        border-radius: 0;
        border-left: none;
        border-right: none;
    }
}
</style>
</head>

<body>

<div class="phone-card">

    <!-- Logo -->
    <div class="logo-box">
        <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="5" height="5" rx="1"></rect>
            <rect x="3" y="12" width="5" height="5" rx="1"></rect>
            <path d="M12 6h9"></path>
            <path d="M12 14h9"></path>
            <path d="M12 10h6"></path>
            <path d="M12 18h6"></path>
        </svg>
    </div>

    <h1>Smart queue</h1>

    <p class="subtitle">
        Manage your organization's queue
    </p>

    <div class="badge-container">
        <span class="badge">Organization portal</span>
    </div>

    <!-- Email -->
    <label for="email">Organization email</label>

    <input
        id="email"
        type="email"
        placeholder="contact@citycare.com"
    >

    <!-- Password -->
    <label for="password">Password</label>

    <input
        id="password"
        type="password"
        placeholder="Enter your password"
    >

    <!-- Forgot Password -->
    <div class="forgot">
        <a href="#">Forgot password?</a>
    </div>

    <!-- Login -->
    <button class="login-btn" id="login-btn">
        Log in
    </button>

    <!-- Divider -->
    <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Different account?</span>
        <div class="divider-line"></div>
    </div>

    <!-- Other Account -->
    <button class="other-btn" id="other-account">
        Log in as user or admin
    </button>

    <div class="back">
        <a href="00-role-selection.html">← Back to role selection</a>
    </div>

</div>

<script>
document.getElementById("login-btn").onclick = function() {
    window.location.href = "07-organization-dashboard.html";
};

document.getElementById("other-account").onclick = function() {
    window.location.href = "00-role-selection.html";
};
</script>

</body>
</html>
