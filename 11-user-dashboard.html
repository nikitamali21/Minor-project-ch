<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#FFFFFF;
  border-radius:14px;
  padding:20px 20px 24px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

h1,h2,h3,p{margin:0;}

input{
  border:1px solid #E5E7EB;
  border-radius:8px;
  padding:11px 12px;
  font-size:14px;
  font-family:inherit;
  width:100%;
  background:#fff;
  color:#18181B;
  outline:none;
}

input::placeholder{color:#9CA3AF;}

svg{
  display:block;
  flex-shrink:0;
}

.clickable{
  cursor:pointer;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">

    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;border-radius:10px;background:#E1F5EE;display:flex;align-items:center;justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
             stroke="#085041" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16"/>
          <path d="M4 12h16"/>
          <path d="M4 18h16"/>
          <path d="M8 6v12"/>
        </svg>
      </div>

      <div>
        <p style="font-size:15px;font-weight:500;">Smart queue</p>
        <p style="font-size:12px;color:#6B7280;">Hi, Aarav</p>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;">

      <div class="clickable" onclick="go('19-user-notifications.html')" style="position:relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span style="position:absolute;top:-3px;right:-4px;width:8px;height:8px;border-radius:50%;background:#D85A30;"></span>
      </div>

      <div class="clickable"
           onclick="go('15-user-profile.html')"
           style="width:32px;height:32px;border-radius:50%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;">
        AM
      </div>

    </div>
  </div>


  <!-- Search -->
  <div style="position:relative;margin-bottom:24px;" class="clickable"
       onclick="go('12-user-search-organization.html')">

    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
         stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         style="position:absolute;left:12px;top:50%;transform:translateY(-50%);">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    </svg>

    <input
      type="text"
      placeholder="Search organizations"
      readonly
      style="padding-left:36px;cursor:pointer;"
    >
  </div>


  <!-- Active Queues -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Your active queues
  </p>

  <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">

    <!-- CityCare -->
    <div class="clickable"
         onclick="go('14-user-queue-status.html')"
         style="background:#E1F5EE;border-radius:12px;padding:14px;">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">

        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:26px;height:26px;border-radius:7px;background:#FAECE7;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#712B13;">
            CC
          </div>

          <p style="font-size:14px;font-weight:500;color:#04342C;">
            CityCare Hospital
          </p>
        </div>

        <span style="font-size:18px;font-weight:500;color:#04342C;">
          #015
        </span>

      </div>

      <p style="font-size:12px;color:#0F6E56;">
        Now serving 011 - you're up in 4
      </p>

    </div>


    <!-- Union Bank -->
    <div class="clickable"
         onclick="go('14-user-queue-status.html')"
         style="background:#EDEDED;border-radius:12px;padding:14px;">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">

        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:26px;height:26px;border-radius:7px;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#0C447C;">
            UB
          </div>

          <p style="font-size:14px;font-weight:500;">
            Union Bank
          </p>
        </div>

        <span style="font-size:18px;font-weight:500;">
          #032
        </span>

      </div>

      <p style="font-size:12px;color:#6B7280;">
        Now serving 030 - you're up in 2
      </p>

    </div>

  </div>


  <!-- Popular -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Popular near you
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;">

    <!-- ABC Salon -->
    <div class="clickable"
         onclick="go('13-user-organization-details.html')"
         style="display:flex;align-items:center;gap:12px;padding:12px;border-bottom:0.5px solid #E5E7EB;">

      <div style="width:34px;height:34px;border-radius:8px;background:#FBEAF0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#72243E;flex-shrink:0;">
        AS
      </div>

      <div style="flex:1;">
        <p style="font-size:14px;font-weight:500;">
          ABC Salon
        </p>
        <p style="font-size:12px;color:#6B7280;">
          18 waiting
        </p>
      </div>

      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>


    <!-- Greenfield College -->
    <div class="clickable"
         onclick="go('13-user-organization-details.html')"
         style="display:flex;align-items:center;gap:12px;padding:12px;">

      <div style="width:34px;height:34px;border-radius:8px;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#6B7280;flex-shrink:0;">
        GC
      </div>

      <div style="flex:1;">
        <p style="font-size:14px;font-weight:500;">
          Greenfield College
        </p>
        <p style="font-size:12px;color:#6B7280;">
          5 waiting
        </p>
      </div>

      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>

  </div>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
