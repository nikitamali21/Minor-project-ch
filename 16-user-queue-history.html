<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Queue History</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 12px;
  background:#EDEDED;
  font-family:'Inter',sans-serif;
  color:#18181B;
  -webkit-font-smoothing:antialiased;
}

.phone-card{
  width:100%;
  max-width:390px;
  min-height:100vh;
}

.card{
  background:#FFFFFF;
  border-radius:14px;
  padding:20px;
  border:0.5px solid #E5E7EB;
  min-height:calc(100vh - 40px);
}

p{margin:0}

.clickable{cursor:pointer}

svg{
  display:block;
  flex-shrink:0;
}

.filter{
  font-size:12px;
  padding:6px 12px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.filter.active{
  background:#085041;
  color:#fff;
}

.filter:not(.active){
  border:0.5px solid #E5E7EB;
  color:#6B7280;
  background:#fff;
}

.history-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
}

.history-item + .history-item{
  border-top:0.5px solid #E5E7EB;
}

.org-icon{
  width:34px;
  height:34px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:500;
  flex-shrink:0;
}

.status{
  font-size:11px;
  padding:2px 8px;
  border-radius:10px;
  white-space:nowrap;
}
</style>
</head>

<body>

<div class="phone-card">
<div class="card">

  <!-- Header -->
  <div
    class="clickable"
    onclick="go('15-user-profile.html')"
    style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">

    <svg width="19" height="19" viewBox="0 0 24 24"
         fill="none" stroke="#18181B" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"/>
    </svg>

    <p style="font-size:14px;font-weight:500;">
      Queue history
    </p>

  </div>


  <!-- Filters -->
  <div style="display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;">

    <button class="filter active" onclick="filterHistory('all',this)">
      All
    </button>

    <button class="filter" onclick="filterHistory('served',this)">
      Served
    </button>

    <button class="filter" onclick="filterHistory('cancelled',this)">
      Cancelled
    </button>

  </div>


  <!-- This Week -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    This week
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;margin-bottom:20px;">

    <!-- CityCare -->
    <div class="history-item" data-status="served">

      <div class="org-icon"
           style="background:#FAECE7;color:#712B13;">
        CC
      </div>

      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">
          CityCare Hospital
        </p>

        <p style="font-size:12px;color:#6B7280;">
          Today - token 011
        </p>
      </div>

      <span class="status"
            style="color:#0F6E56;background:#E1F5EE;">
        Served
      </span>

    </div>


    <!-- Union Bank -->
    <div class="history-item" data-status="cancelled">

      <div class="org-icon"
           style="background:#E6F1FB;color:#0C447C;">
        UB
      </div>

      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">
          Union Bank
        </p>

        <p style="font-size:12px;color:#6B7280;">
          Tue - token 028
        </p>
      </div>

      <span class="status"
            style="color:#791F1F;background:#FCEBEB;">
        Cancelled
      </span>

    </div>

  </div>


  <!-- Earlier -->
  <p style="font-size:13px;color:#6B7280;margin-bottom:8px;">
    Earlier
  </p>

  <div style="border:0.5px solid #E5E7EB;border-radius:10px;overflow:hidden;">

    <!-- ABC Salon -->
    <div class="history-item" data-status="served">

      <div class="org-icon"
           style="background:#FBEAF0;color:#72243E;">
        AS
      </div>

      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">
          ABC Salon
        </p>

        <p style="font-size:12px;color:#6B7280;">
          Aug 21 - token 006
        </p>
      </div>

      <span class="status"
            style="color:#0F6E56;background:#E1F5EE;">
        Served
      </span>

    </div>


    <!-- Greenfield College -->
    <div class="history-item" data-status="skipped">

      <div class="org-icon"
           style="background:#F0F0F0;color:#6B7280;">
        GC
      </div>

      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">
          Greenfield College
        </p>

        <p style="font-size:12px;color:#6B7280;">
          Aug 14 - token 041
        </p>
      </div>

      <span class="status"
            style="color:#854F0B;background:#FAEEDA;">
        Skipped
      </span>

    </div>


    <!-- CityCare -->
    <div class="history-item" data-status="served">

      <div class="org-icon"
           style="background:#FAECE7;color:#712B13;">
        CC
      </div>

      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:500;">
          CityCare Hospital
        </p>

        <p style="font-size:12px;color:#6B7280;">
          Aug 09 - token 003
        </p>
      </div>

      <span class="status"
            style="color:#0F6E56;background:#E1F5EE;">
        Served
      </span>

    </div>

  </div>

</div>
</div>


<script>
function go(page){
  window.location.href = page;
}

function filterHistory(type, button){

  document.querySelectorAll('.filter').forEach(function(btn){
    btn.classList.remove('active');
  });

  button.classList.add('active');

  document.querySelectorAll('.history-item').forEach(function(item){

    const status = item.dataset.status;

    if(type === 'all'){
      item.style.display = 'flex';
    }
    else if(type === status){
      item.style.display = 'flex';
    }
    else{
      item.style.display = 'none';
    }

  });
}
</script>

</body>
</html>
